<article class="post">
  {{COVER}}
  <header class="post-head">
    <h1>{{TITLE}}</h1>
    <div class="post-meta">
      <time datetime="{{DATE_ISO}}">{{DATE}}</time>
      {{READING_TIME}}
      {{UPDATED}}
      {{PAGE_VIEWS}}
      {{CATEGORY}}
      {{TAGS}}
    </div>
  </header>
  {{TOC}}
  <div class="post-body">
{{CONTENT}}
  </div>
  {{RELATED}}
  <nav class="post-pager" aria-label="上下篇文章">
    {{PREV}}
    {{NEXT}}
  </nav>
</article>
{{COMMENTS}}
